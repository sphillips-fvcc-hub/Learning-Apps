name: Publish Shinylive Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinylive

      - name: Build Shinylive site
        shell: Rscript {0}
        run: |
          dir.create("site", showWarnings = FALSE)

          shinylive::export(
            "unit-circle",
            "site",
            subdir = "unit-circle"
          )

          shinylive::export(
            "x-coordinate-explorer",
            "site",
            subdir = "x-coordinate-explorer"
          )

          shinylive::export(
            "sine-function-explorer",
            "site",
            subdir = "sine-function-explorer"
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
